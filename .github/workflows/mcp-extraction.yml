name: MCP Extraction

# The other half of trigger-mcp-extraction.yml.
#
# That workflow fires on every Vercel deploy of main and dispatches
# `react-docs-deployed` and `native-docs-deployed` — at this repository. Nothing
# listened for either event, so the relay reported success into a void on every
# run and the MCP datasets in R2 were never refreshed. That is why ctx.json sat
# at v1.0.0 while packages/react moved to 1.3.0: not a broken extractor, a
# missing listener.
#
# The extraction reads the component catalog from the deployed docs site and
# GitHub, stamps it with the completeness verdicts from
# apps/react-mcp/src/shared/behavior, and writes it to R2, where the MCP API
# serves it.

on:
  repository_dispatch:
    types:
      - react-docs-deployed
      - native-docs-deployed
  workflow_dispatch:
    inputs:
      target:
        description: "Which MCP datasets to refresh"
        required: false
        default: both
        type: choice
        options:
          - react
          - native
          - both

concurrency:
  # Scoped per dispatch type, not per workflow.
  #
  # Vercel fires several deployment events per deploy, and the trigger relays
  # each one as BOTH react-docs-deployed and native-docs-deployed. With a single
  # shared group they queue into one lane, and since only one run may be pending
  # per group, every newcomer cancels the one waiting. In practice that starved
  # React completely: of the first eight runs, all four React ones were
  # cancelled and only Native ever executed.
  #
  # One lane per dispatch type means React and Native no longer cancel each
  # other, while duplicate events within a type still collapse — which is the
  # deduplication that was wanted.
  group: mcp-extraction-${{ github.event.action || inputs.target || 'manual' }}
  cancel-in-progress: false

jobs:
  # Whether this repository can talk to R2 at all.
  #
  # The `secrets` context is not available in a job-level `if`, so the check has
  # to run as a job and hand its answer downstream as an output.
  #
  # An automatic run over a repository with no credentials skips rather than
  # fails: a deploy that had nothing to do with the MCP should not paint the
  # commit red. A manual run still fails, because someone asking for a refresh
  # by hand deserves to be told why they are not getting one.
  #
  # It is never silently green. The skip is annotated as a warning and written
  # to the run summary, and the extraction jobs report as skipped rather than
  # succeeded — the point being that "this workflow passed" must never again be
  # mistakable for "the data is fresh".
  preflight:
    name: Check R2 credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Look for R2 credentials
        id: check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for var in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [ -z "${!var}" ] && missing="$missing $var"
          done

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✅ R2 credentials present"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          {
            echo "### MCP extraction skipped"
            echo ""
            echo "The R2 datasets were **not** refreshed: this repository has no R2 credentials."
            echo ""
            echo "The extraction needs S3-style R2 keys (not a Cloudflare API token):"
            for var in $missing; do echo "- \`$var\`"; done
            echo ""
            echo "Add them under **Settings → Secrets and variables → Actions**."
            echo "Until then \`ctx.json\` keeps whatever version it already had, and every MCP"
            echo "response is stamped with it."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=MCP extraction skipped::No R2 credentials. Missing:$missing — the datasets were not refreshed."

          # Asked for by hand: say no out loud rather than shrugging.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error title=MCP extraction is not configured::Missing repository secrets:$missing"
            exit 1
          fi

  react:
    name: Extract React MCP data to R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: |
      needs.preflight.outputs.configured == 'true' && (
        github.event_name == 'workflow_dispatch' && (inputs.target == 'react' || inputs.target == 'both') ||
        github.event.action == 'react-docs-deployed' && (
          github.event.client_payload.git_ref == 'main' ||
          github.event.client_payload.git_ref == 'refs/heads/main'
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install
        uses: ./.github/common-actions/install

      - name: Extract React components and theme
        working-directory: apps/react-mcp
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/extract.sh production both

      # An extraction that uploads nothing still exits 0 today. Read the dataset
      # back and assert it is the shape the API expects, so a silent no-op
      # cannot pass for a refresh a second time.
      - name: Verify the uploaded dataset
        working-directory: apps/react-mcp
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm exec tsx scripts/verify-extraction.ts

  native:
    name: Extract Native MCP data to R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: |
      needs.preflight.outputs.configured == 'true' && (
        github.event_name == 'workflow_dispatch' && (inputs.target == 'native' || inputs.target == 'both') ||
        github.event.action == 'native-docs-deployed' && (
          github.event.client_payload.git_ref == 'main' ||
          github.event.client_payload.git_ref == 'refs/heads/main'
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install
        uses: ./.github/common-actions/install

      - name: Extract Native components and theme
        working-directory: apps/native-mcp
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/extract.sh production both
